name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems (an agent getting around an approval, reading a password field, escaping a tab) go to a [private security report](https://github.com/EJOBS-IT/uabc/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Ask the agent to …
        3. …
    validations:
      required: true
  - type: dropdown
    id: frontend
    attributes:
      label: How the AI reached the browser
      options:
        - Built-in assistant (side panel)
        - Local AI tool through MCP (Claude Code, Codex, Cursor, …)
        - Cloud AI app through the relay
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: UABC extension, `uabc --version`, browser and version, operating system, AI client or model.
      placeholder: "extension 0.2.0, uabc 0.2.0, Chrome 141, Windows 11, Claude Code"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, connector URLs, cookies and personal data first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, connector URLs and personal data from everything above.
          required: true
