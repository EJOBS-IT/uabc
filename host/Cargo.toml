[package]
name = "uabc"
description = "Universal AI Browser Controller: native messaging host + MCP server that lets AI agents drive your real Chrome."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = "1.88"

[[bin]]
name = "uabc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
getrandom = "0.4"
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Memory",
] }

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
base64 = "0.23.1"
tempfile = "3"
